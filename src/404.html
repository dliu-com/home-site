<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Dewei Liu</title>
  <link rel="icon" type="image/png" href="https://files.dliu.com/dliu.com/favicon.png">

  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <style>
    :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6f76; --accent: #2f7de1; }

      :root { --bg: #111214; --fg: #ececee; --muted: #9a9ca3; --accent: #6aa8ff; }
    }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif;
    }
    main { max-width: 680px; margin: 0 auto; padding: 72px 24px; }
    h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 20px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
